name: Atualizar dados

# Coleta os dados do TCE-SP todo dia, gera o painel e grava o resultado no repositório.
# Os dados brutos ficam no cache do GitHub Actions (compactados), não no git.
# O Cloudflare Pages (conectado a este repositório) republica o site a cada commit.
on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 06:17 em Brasília
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write
  actions: write

concurrency:
  group: atualizar
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Recuperar dados brutos já baixados
        uses: actions/cache/restore@v4
        with:
          path: dados
          key: dados-brutos-${{ github.run_id }}
          restore-keys: dados-brutos-

      - name: Coletar no TCE-SP
        run: timeout 300m python coletor/coletar.py || echo "coleta parcial; segue com o que foi baixado"

      - name: Totais oficiais do Tesouro Nacional (Siconfi) para conferência
        run: cd coletor && timeout 30m python siconfi.py || echo "Siconfi indisponível; segue sem conferência"

      - name: Guardar dados brutos para a próxima execução
        if: always()
        uses: actions/cache/save@v4
        with:
          path: dados
          key: dados-brutos-${{ github.run_id }}

      - run: python coletor/processar.py

      - name: Publicar resumo no repositório
        run: |
          git config user.name "olho-publico-bot"
          git config user.email "bot@users.noreply.github.com"
          git add site/dados
          git diff --cached --quiet || git commit -m "Atualização automática $(date -u +%F)"
          git pull --rebase -X theirs -q origin main
          git push
