name: Atualizar dados

# Coleta os dados do TCE-SP todo dia e grava no repositório.
# O Cloudflare Pages (conectado a este repositório) republica o site a cada commit.
on:
  schedule:
    - cron: "17 9 * * *"   # todo dia, 06:17 em Brasília
  workflow_dispatch:        # botão "Run workflow" para rodar na hora

permissions:
  contents: write

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python coletor/coletar.py
      - run: python coletor/processar.py
      - name: Guardar dados no repositório (histórico auditável)
        run: |
          git config user.name "olho-publico-bot"
          git config user.email "bot@users.noreply.github.com"
          git add dados site/dados
          git diff --cached --quiet || git commit -m "Atualização automática $(date -u +%F)"
          git push
